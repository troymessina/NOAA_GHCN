name: Refresh data catalog

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install DuckDB CLI
        run: |
          curl -sL -o duckdb.zip https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip
          unzip -o duckdb.zip
          chmod +x duckdb
          echo "DUCKDB_PATH=$PWD/duckdb" >> "$GITHUB_ENV"

      - run: npm run data:catalog
      - run: npm run data:aggregates

      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "Refresh NOAA GHCN data catalog"
          git push
