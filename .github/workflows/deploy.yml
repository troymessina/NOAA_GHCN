name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # refresh-data.yml pushes its data-catalog commits using the default
  # GITHUB_TOKEN, and GitHub Actions deliberately does not let a GITHUB_TOKEN
  # push trigger other workflows (loop prevention) - so without this, a
  # successful data refresh would silently never redeploy the site.
  workflow_run:
    workflows: ['Refresh data catalog']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
